# Publishes this n8n community node package to npm on every version tag push.
#
# Nodes submitted for n8n Cloud verification must be published via GitHub
# Actions with an npm provenance statement (required since May 1 2026).
# Provenance lets anyone cryptographically verify that a package was built by
# this exact workflow, from this exact repository and commit. A version
# published from a laptop carries no provenance and is rejected at submission.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────
#
# @n8n/node-cli >= 0.23.0 is required. Earlier versions do not pass the
# provenance flag in CI. Check with:
#
#   npm list @n8n/node-cli
#
# ─── AUTHENTICATION ────────────────────────────────────────────────────
#
# Trusted Publishing (OIDC) - the option to use:
#   1. npmjs.com -> Packages -> n8n-nodes-boldrouter -> Settings ->
#      Trusted publishing -> Add.
#   2. Publisher: GitHub Actions.  Organization or user: boldrouter.
#      Repository: n8n-nodes-boldrouter.  Workflow filename: publish.yml.
#      Environment: leave blank.
#   3. Leave NPM_TOKEN unset in repository secrets. The OIDC exchange
#      authenticates instead, so no long-lived credential exists anywhere.
#
# Bootstrapping a NEW package name:
#   A trusted publisher can only be configured on a package that already
#   exists, so the very first publish of a new name cannot use OIDC. Claim the
#   name once from a maintainer's machine:
#
#     npm login
#     RELEASE_MODE=true npm publish
#
#   RELEASE_MODE is required because the prepublishOnly hook otherwise blocks
#   a bare npm publish. That first version has no provenance and is not
#   eligible for verification - configure trusted publishing afterwards, then
#   release the next version through this workflow and submit that one.
#
# Granular access token (fallback):
#   npmjs.com -> Access Tokens -> Granular Access Token, with "Read and write"
#   on this package and "Bypass 2FA" enabled, stored as the NPM_TOKEN
#   repository secret. npm removed classic and automation tokens in November
#   2025, and is deprecating direct publishing with bypass-2FA tokens by
#   January 2027 - so treat this as a stopgap and prefer trusted publishing.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0), with no "v"
# prefix. If you prefer v-prefixed tags, change the filter to 'v*.*.*'.
#
# ─── RELEASE PROCESS ──────────────────────────────────────────────────
#
#   npm run release
#
# Lints, builds, prompts for a version bump, regenerates the changelog,
# commits, tags and pushes - and the tag push triggers this workflow. It
# requires at least one commit since the last tag, and a GITHUB_TOKEN with
# write access for the GitHub release step.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        #
        # Option A (OIDC): leave NPM_TOKEN unset — the token step is skipped and
        #   npm uses the OIDC exchange instead.
        # Option B (token): set NPM_TOKEN in repo secrets — it is written to
        #   .npmrc here before publishing.
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
